name: Build PocketFlip APK from ZIP

"on":
  push:
    paths:
      - 'pocketflip-project.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Extract project and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Extract PocketFlip project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/pocketflip-project.zip"
          EXTRACT_DIR="$RUNNER_TEMP/pocketflip-source"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: pocketflip-project.zip is missing from the repository root."
            echo "Upload the ZIP to the top level of the repository with this exact name."
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -maxdepth 6 -type f -name settings.gradle -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: Could not find settings.gradle inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: Could not find app/build.gradle beside settings.gradle."
            exit 1
          fi

          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          echo "PocketFlip project extracted."
          test -f "$GITHUB_WORKSPACE/settings.gradle"
          test -f "$GITHUB_WORKSPACE/app/build.gradle"

      - name: Verify Android app module
        shell: bash
        run: |
          set -euo pipefail
          gradle projects --console=plain
          gradle :app:tasks --all --console=plain | grep -E 'assemble(Debug|Release)'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketFlip-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
