
name: Build PocketFlip APK from ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Extract project and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Extract PocketFlip project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/pocketflip-project.zip"
          EXTRACT_DIR="$RUNNER_TEMP/pocketflip-source"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: pocketflip-project.zip is missing from repository root."
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -maxdepth 8 -type f -name settings.gradle -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"

          shopt -s dotglob nullglob

          for item in "$PROJECT_DIR"/*; do
            if [[ "$(basename "$item")" == ".github" ]]; then
              continue
            fi
            cp -a "$item" "$GITHUB_WORKSPACE/"
          done

          echo "Project extracted successfully."

      - name: Verify Android project
        run: |
          gradle projects --console=plain
          gradle :app:tasks --all --console=plain | grep -E 'assemble(Debug|Release)'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketFlip-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
