name: Build PocketFlip APK from ZIP

on:
  push:
    paths:
      - 'pocketflip-project.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Extract PocketFlip project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/pocketflip-project.zip"
          EXTRACT_DIR="$RUNNER_TEMP/pocketflip-source"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: pocketflip-project.zip was not found in the repository root."
            echo "Upload the project ZIP to the top level of the repository using this exact filename."
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -maxdepth 5 -type f -name settings.gradle -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle was not found inside the ZIP."
            echo "The ZIP must contain the Android project files, not another unrelated archive."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: app/build.gradle was not found next to settings.gradle."
            echo "The ZIP does not appear to contain the expected PocketFlip Android app module."
            exit 1
          fi

          echo "Extracting Android project from: $PROJECT_DIR"
          shopt -s dotglob nullglob
          for item in "$PROJECT_DIR"/*; do
            # Keep the workflow stored in GitHub; do not replace it with a copy from the ZIP.
            if [[ "$(basename "$item")" == ".github" ]]; then
              continue
            fi
            cp -a "$item" "$GITHUB_WORKSPACE/"
          done

          echo "--- Project files ---"
          test -f "$GITHUB_WORKSPACE/settings.gradle"
          test -f "$GITHUB_WORKSPACE/app/build.gradle"
          echo "PocketFlip Android project extracted successfully."

      - name: Verify Gradle Android module
        run: |
          set -euo pipefail
          gradle projects --console=plain
          gradle :app:tasks --all --console=plain | grep -E 'assemble(Debug|Release)'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketFlip-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
